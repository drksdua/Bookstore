name: Build & Push to Docker Hub + Deploy to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: drksdua/test-site-azure   # заміни, якщо інший репозиторій

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: "repository"        # ← ТОЧНА назва твого Environment
    steps:
      - uses: actions/checkout@v4

      - name: Preflight (Docker secrets exist?)
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN in this environment."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: "type=registry,ref=${{ env.IMAGE_NAME }}:latest"
          cache-to: type=inline

  deploy-to-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: "repository"        # ← ТОЧНА назва твого Environment
    steps:
      - name: Preflight (AZURE_CREDENTIALS exists?)
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "::error::Missing AZURE_CREDENTIALS in this environment."
            exit 1
          fi

      - name: Azure login (service principal JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Web App image and restart
        run: |
          az webapp config container set \
            -g "test-site-azure_group" -n "test-site-azure" \
            --docker-custom-image-name "docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --docker-registry-server-url "https://index.docker.io"
          # якщо репо приватний — додай до команди вище:
          #   --docker-registry-server-user "${{ secrets.DOCKERHUB_USERNAME }}" \
          #   --docker-registry-server-password "${{ secrets.DOCKERHUB_TOKEN }}"

          az webapp config appsettings set \
            -g "test-site-azure_group" -n "test-site-azure" \
            --settings WEBSITES_PORT=80

          az webapp restart -g "test-site-azure_group" -n "test-site-azure"
